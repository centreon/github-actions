name: lint

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    # edited: the title decides the release, re-check it when it changes
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  PYTEST_VERSION: "9.2.0"
  RUFF_VERSION: "0.17.4"

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check actions are self-contained and pinned
        run: .github/scripts/check-actions.sh

      - name: Preview the releases of this pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/release.py plan --title "$PR_TITLE" --base "origin/${BASE_REF}"

      - name: Test the release script
        run: |
          pipx run "ruff==${RUFF_VERSION}" check .github/scripts
          pipx run "ruff==${RUFF_VERSION}" format --check .github/scripts
          cd .github/scripts
          pipx run --spec "pytest==${PYTEST_VERSION}" pytest -q -p no:cacheprovider

      - name: Shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -S warning "${scripts[@]}"

      - name: Actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
