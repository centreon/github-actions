name: lint

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    # edited: the title decides the release, re-check it when it changes
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  JACTIONLINT_VERSION: "2.6.0"
  BATS_VERSION: "1.13.0"
  ZIZMOR_VERSION: "1.32.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh "$PR_TITLE"

      - name: Check actions are packaged, self-contained and pinned
        run: .github/scripts/check-actions.sh

      - name: Shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -S warning "${scripts[@]}"

      - name: Bats tests
        run: |
          mapfile -t test_dirs < <(git ls-files '*.bats' | xargs -n 1 dirname | sort -u)
          npx --yes "bats@${BATS_VERSION}" "${test_dirs[@]}"

      # deb feature deliveries are skipped: this runs the action up to the
      # repository layout, on a real runner, without any Pulp server
      - name: Smoke test the wiring of pulp/package-delivery
        uses: $/pulp/package-delivery
        with:
          module_name: smoke-test
          distrib: bookworm
          version: "26.10"
          cache_key: unused
          stability: unstable
          is_cloud: "false"
          delivery_type: feature
          pulp_url: https://pulp.invalid
          pulp_content_url: https://pulp.invalid
          audience: unused

      - name: Zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline .

      - name: Jactionlint
        run: pipx run "jactionlint==${JACTIONLINT_VERSION}"

      - name: Smoke test the wiring of packaging/parse-distrib
        id: parse-distrib-smoke
        uses: $/packaging/parse-distrib
        with:
          distrib: bookworm

      - name: Check the smoke-tested outputs
        env:
          PACKAGE_EXTENSION: ${{ steps.parse-distrib-smoke.outputs.package_extension }}
          PACKAGE_DISTRIB_NAME: ${{ steps.parse-distrib-smoke.outputs.package_distrib_name }}
          DISTRIB_FAMILY: ${{ steps.parse-distrib-smoke.outputs.distrib_family }}
          PACKAGE_DISTRIB: ${{ steps.parse-distrib-smoke.outputs.package_distrib }}
        run: |
          [[ "$PACKAGE_EXTENSION" == "deb" && "$PACKAGE_DISTRIB_NAME" == "deb12u1" ]]
          [[ "$DISTRIB_FAMILY" == "debian" && "$PACKAGE_DISTRIB" == "bookworm" ]]

      # dry run: builds a tarball on a real runner and uploads nothing. Last step:
      # the action renames the archived directory in the workspace
      - name: Smoke test the wiring of download-site/sources-delivery
        id: sources-smoke
        uses: $/download-site/sources-delivery
        with:
          bucket_directory: smoke-test
          module_directory: download-site
          module_name: smoke-test
          major_version: "1.0"
          minor_version: "0"
          dry_run: "true"

      - name: Check the smoke-tested tarball
        env:
          SOURCE_FILE: ${{ steps.sources-smoke.outputs.source_file }}
          DESTINATION: ${{ steps.sources-smoke.outputs.destination }}
        run: |
          [[ "$SOURCE_FILE" == "smoke-test-1.0.0.tar.gz" && -f "$SOURCE_FILE" ]]
          [[ "$DESTINATION" == "s3://centreon-download/public/smoke-test/smoke-test-1.0.0.tar.gz" ]]
          tar tzf "$SOURCE_FILE" | grep -q "^smoke-test-1.0.0/sources-delivery/action.yml$"

  # most callers of the packaging actions run in a container, where paths differ
  smoke-container:
    name: smoke (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75
          - name: almalinux
            image: almalinux:9@sha256:02df05719ef287ebd0df0a1eedb9172a00bd70703aed7b25660e426b8e0d6047
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Smoke test packaging/parse-distrib in a container
        id: parse-distrib-smoke
        uses: $/packaging/parse-distrib
        with:
          distrib: el9

      - name: Check the smoke-tested outputs
        env:
          PACKAGE_DISTRIB_NAME: ${{ steps.parse-distrib-smoke.outputs.package_distrib_name }}
          DISTRIB_FAMILY_MAJOR: ${{ steps.parse-distrib-smoke.outputs.distrib_family_major }}
        run: |
          [[ "$PACKAGE_DISTRIB_NAME" == "el9" && "$DISTRIB_FAMILY_MAJOR" == "el9" ]]
