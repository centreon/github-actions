name: move-major-tag

# Roll a floating major tag back (or forward) to an existing release of its
# package, without waiting for a new release. See the README.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release the major tag must point at, e.g. pulp/v1.4.1"
        required: true
        type: string

permissions: {}

jobs:
  move-major-tag:
    name: move-major-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # the environment only allows main and holds the release app key
    environment: release
    permissions:
      contents: read
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Move the major tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/update-major-tags.sh "$RELEASE_TAG"
