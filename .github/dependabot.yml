version: 2
updates:
  # pins of the workflows of this repository and of every shared action
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
      - "gha"
